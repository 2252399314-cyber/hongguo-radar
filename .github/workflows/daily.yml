name: daily

on:
  schedule:
    - cron: '0 4 * * *'   # 北京时间 12:00
    - cron: '0 7 * * *'   # 北京时间 15:00，兜底，允许官方榜单未更新
  workflow_dispatch:
    inputs:
      allow_stale:
        description: '官方榜单没更新也写快照'
        type: boolean
        default: false
      force:
        description: '覆盖当天已有的快照'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: Collect and derive
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ] || [ "${{ inputs.allow_stale }}" = "true" ]; then
            ARGS="$ARGS --allow-stale"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m radar run $ARGS
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据没有变化"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python -m radar build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
